<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head %}
  </head>
  <body>
    <main class="with-top-band">
      <div class="top-band">
        {% if page.title != "Ben Eggers" %}
        <a class="back-link" href="{% protocol %}://{% base_url %}"
          >← Back to Home</a
        >
        {% end if %}
      </div>
      <header>
        <h1>{% page.title %}</h1>
        {% if page.subtitle %}
        <p class="subtitle">{% page.subtitle %}</p>
        {% end if %}
      </header>
      {% slot %}
      <footer class="site-footer">{% include footer %}</footer>
    </main>
  </body>
</html>
