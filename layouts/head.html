{% define head %}
<title>{% page.meta_title %}</title>
<script
  src="https://kit.fontawesome.com/5a53cab38d.js"
  crossorigin="anonymous"
></script>
<meta name="description" content="{% page.description %}" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta charset="UTF-8" />
<link
  rel="icon"
  type="image/x-icon"
  href="{% protocol %}://favicon.{% base_url %}"
/>
<link
  rel="sitemap"
  type="application/xml"
  title="Sitemap"
  href="{% protocol %}://sitemap.{% base_url %}"
/>
{% include plausible %}
<style>
  {% page.style %}
</style>
<script>
  (function () {
    function isInternal(url) {
      try {
        var u = new URL(url, window.location.href);
        var h = u.hostname;
        var base = "{% base_url %}";
        return (
          h === base ||
          h.endsWith("." + base) ||
          h === "beneggers.com" ||
          h.endsWith(".beneggers.com") ||
          h === "localhost" ||
          h.endsWith(".localhost") ||
          h === "localhost.com" ||
          h.endsWith(".localhost.com")
        );
      } catch (e) {
        return false;
      }
    }

    function isHttp(href) {
      return href.indexOf("http://") === 0 || href.indexOf("https://") === 0;
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("a[href]").forEach(function (a) {
        var href = a.getAttribute("href");
        if (
          !href ||
          href[0] === "#" ||
          href.indexOf("mailto:") === 0 ||
          href.indexOf("tel:") === 0
        )
          return;
        var absolute = isHttp(href);
        var internal = isInternal(href);
        if (absolute && !internal) {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        } else {
          a.removeAttribute("target");
          a.removeAttribute("rel");
        }
      });
    });
  })();
</script>
{% end head %}
